<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Samartha Sweets & Mess ERP</title>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #FAF6EC;
    --paper: #FFFDF8;
    --ink: #2B2318;
    --ink-soft: #6b5f4d;
    --maroon: #7C3131;
    --maroon-dark: #5c2323;
    --turmeric: #C98A1A;
    --line: #E5D9C0;
    --good: #4A7856;
    --bad: #B24444;
    --shadow: 0 1px 0 rgba(43,35,24,0.06);
  }
  html.dark{
    --bg: #1E1B16;
    --paper: #2A251E;
    --ink: #F0E9DC;
    --ink-soft: #B5A88F;
    --maroon: #C97070;
    --maroon-dark: #E39696;
    --turmeric: #E3B24E;
    --line: #3D362A;
    --good: #6FBF8C;
    --bad: #E38080;
    --shadow: 0 1px 0 rgba(0,0,0,0.2);
  }
  body{ transition: background 0.2s, color 0.2s; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app{
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 14px 60px;
  }
  header.top{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 6px 4px 16px;
    border-bottom: 2px solid var(--maroon);
    margin-bottom: 14px;
  }
  .app-logo{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--maroon), 0 2px 6px rgba(0,0,0,0.15);
  }
  header.top h1{
    font-size: 22px;
    margin:0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.top .sub{
    font-size: 12px;
    color: var(--ink-soft);
  }
  nav.tabs{
    display:flex;
    gap: 4px;
    margin-bottom: 16px;
    background: var(--line);
    padding: 4px;
    border-radius: 10px;
    overflow-x: auto;
  }
  nav.tabs button{
    flex: 0 0 auto;
    padding: 9px 12px;
    border:none;
    background: transparent;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    border-radius: 7px;
    cursor:pointer;
    white-space: nowrap;
  }
  nav.tabs button.active{
    background: var(--paper);
    color: var(--maroon-dark);
    box-shadow: var(--shadow);
  }
  section{ display:none; }
  section.active{ display:block; }

  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h2{
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--maroon-dark);
  }
  .row{ display:flex; gap:8px; flex-wrap: wrap; margin-bottom:8px; }
  .row > *{ flex:1; min-width: 100px; }
  label{ font-size: 11.5px; color: var(--ink-soft); display:block; margin-bottom:3px; }
  input, select{
    width:100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
  }
  button.primary{
    background: var(--maroon);
    color: #fff;
    border:none;
    padding: 10px 16px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor:pointer;
    width:100%;
  }
  button.primary:active{ background: var(--maroon-dark); }
  button.ghost{
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .student-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    gap: 8px;
  }
  .student-row:last-child{ border-bottom:none; }
  .student-name{ font-weight:600; font-size:14.5px; }
  .student-meta{ font-size: 11.5px; color: var(--ink-soft); }
  .badge{
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    white-space:nowrap;
  }
  .badge.paid{ background:#e4efe6; color: var(--good); }
  .badge.due{ background:#f6e3e3; color: var(--bad); }
  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 24px 10px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 12px;
  }
  .month-nav .m-label{ font-weight:700; font-size: 15px; }
  .month-nav button{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 7px;
    width: 32px; height: 32px;
    font-size: 16px;
    cursor:pointer;
    color: var(--maroon-dark);
  }
  .att-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .att-day{
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    cursor:pointer;
    background: #fff;
    color: var(--ink-soft);
  }
  .att-day.present{ background: var(--good); color:#fff; border-color: var(--good); }
  .att-day.blank{ visibility:hidden; }
  .student-picker{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .chip{
    flex-shrink:0;
    padding: 7px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    font-size: 12.5px;
    font-weight: 600;
    background: #fff;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .chip.sel{ background: var(--maroon); color:#fff; border-color: var(--maroon); }
  .tiffin-entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 9px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .tiffin-entry:last-child{ border-bottom:none; }
  .amt{ font-weight:700; color: var(--maroon-dark); }
  .summary-strip{
    display:flex;
    gap:8px;
    margin-bottom: 14px;
  }
  .stat{
    flex:1;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    text-align:center;
  }
  .stat .n{ font-size: 18px; font-weight:800; color: var(--maroon-dark); }
  .stat .l{ font-size: 10.5px; color: var(--ink-soft); margin-top:2px; }
  .del{ color: var(--bad); font-size: 11px; background:none; border:none; cursor:pointer; padding: 4px; }
  .loading{ text-align:center; padding: 40px; color: var(--ink-soft); font-size:13px; }
  .toast{
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--maroon-dark);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display:flex;
    align-items:center;
    gap: 14px;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .toast button{
    background: rgba(255,255,255,0.18);
    border:none;
    color:#fff;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight:700;
    cursor:pointer;
  }
  .avatar{
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--line);
    flex-shrink:0;
  }
  .avatar-placeholder{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
    flex-shrink:0;
  }
  .row-with-avatar{ display:flex; align-items:center; gap:10px; flex:1; }
  .check{ width:18px; height:18px; flex-shrink:0; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .toggle-row:last-child{ border-bottom:none; }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; cursor:pointer; inset:0; background:var(--line); border-radius:24px; transition:0.2s; }
  .slider:before{ position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.2s; }
  input:checked + .slider{ background: var(--maroon); }
  input:checked + .slider:before{ transform: translateX(18px); }
  .badge.low{ background:#fbe9d3; color: var(--turmeric); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

function lastNMonths(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({ key: monthKey(d), label: d.toLocaleDateString('en-IN',{month:'short'}) });
  }
  return out;
}

let db = null;

function normalizeData(raw){
  const d = (raw && typeof raw === 'object') ? raw : {};
  d.students = d.students || [];
  d.attendance = d.attendance || {};
  d.payments = d.payments || [];
  d.tiffinLog = d.tiffinLog || [];
  d.products = (d.products && d.products.length && d.products[0].packets) ? d.products : DEFAULT_PRODUCTS;
  d.sweetSales = d.sweetSales || [];
  d.production = d.production || [];
  d.expenses = d.expenses || [];
  d.settings = d.settings || { dueDay: 5, darkMode: false, pin: null, lowStock: {} };
  d.settings.dueDay = d.settings.dueDay || 5;
  d.settings.lowStock = d.settings.lowStock || {};
  return d;
}

function loadData(){
  if(FIREBASE_CONFIG.apiKey === 'PASTE_API_KEY_HERE'){
    document.getElementById('app').innerHTML = '<div style="max-width:420px;margin:60px auto;padding:0 16px;"><div class="card"><h2>Setup needed</h2><div class="student-meta">This app needs your Firebase details before it can run. Open SETUP.md in this project for step-by-step instructions, then paste your config into index.html where it says FIREBASE_CONFIG.</div></div></div>';
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="card"><div class="empty">Firebase could not start. Double-check the config values in index.html.</div></div>';
    return;
  }
  db.collection('messShared').doc('main').onSnapshot((snap)=>{
    if(snap.exists && snap.data().json){
      try{ data = normalizeData(JSON.parse(snap.data().json)); }catch(e){ data = normalizeData(data); }
    } else {
      data = normalizeData(data);
    }
    applyTheme();
    if(data.settings.pin && !unlocked){
      renderLockScreen();
    } else {
      render();
    }
  }, (err)=>{
    console.error('Firestore error', err);
    document.getElementById('app').innerHTML = '<div class="card"><div class="empty">Could not connect to the shared database. Check your internet connection and that Firestore rules allow access (see SETUP.md).</div></div>';
  });
}

function applyTheme(){
  document.documentElement.classList.toggle('dark', !!data.settings.darkMode);
}

function renderLockScreen(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="max-width:320px;margin:60px auto;text-align:center;">
      <img class="app-logo" src="data:image/webp;base64,${LOGO_B64}" alt="Samartha Sweets logo" style="width:72px;height:72px;margin-bottom:14px;">
      <h1 style="font-size:20px;margin-bottom:6px;">Samartha Sweets &amp; Mess ERP</h1>
      <div style="color:var(--ink-soft);font-size:13px;margin-bottom:20px;">Enter PIN to unlock</div>
      <div id="pin-dots" style="display:flex;gap:10px;justify-content:center;margin-bottom:20px;">
        ${Array(4).fill(0).map((_,i)=>`<div style="width:14px;height:14px;border-radius:50%;border:2px solid var(--maroon);background:${i<pinEntryValue.length?'var(--maroon)':'transparent'};"></div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="ghost pin-key" data-key="${k}" style="padding:16px 0;font-size:16px;">${k}</button>`).join('')}
      </div>
      <div id="pin-error" style="color:var(--bad);font-size:12px;margin-top:14px;height:14px;"></div>
    </div>
  `;
  app.querySelectorAll('.pin-key').forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.key;
      if(k==='⌫'){ pinEntryValue = pinEntryValue.slice(0,-1); renderLockScreen(); return; }
      if(k==='') return;
      if(pinEntryValue.length<4){ pinEntryValue += k; }
      if(pinEntryValue.length===4){
        if(pinEntryValue===data.settings.pin){
          unlocked = true; pinEntryValue=''; render();
        } else {
          document.getElementById('pin-error').textContent = 'Incorrect PIN';
          pinEntryValue = '';
          setTimeout(renderLockScreen, 400);
          return;
        }
      }
      renderLockScreen();
    };
  });
}

async function saveData(){
  try{
    await db.collection('messShared').doc('main').set({ json: JSON.stringify(data), updatedAt: Date.now() });
  }catch(e){
    console.error('save failed', e);
    alert('Could not save — check your internet connection.');
  }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function fmtMoney(n){ return '₹' + n.toLocaleString('en-IN'); }

function waLink(phone, message){
  const digits = (phone||'').replace(/\D/g,'');
  const withCode = digits.length===10 ? '91'+digits : digits;
  return `https://wa.me/${withCode}?text=${encodeURIComponent(message)}`;
}

async function sendReminder(name, phone, message){
  if(phone && phone.replace(/\D/g,'').length>=10){
    window.open(waLink(phone, message), '_blank');
  } else {
    try{
      await navigator.clipboard.writeText(message);
      alert('No phone number saved for ' + name + ' — reminder text copied instead, so you can paste it anywhere.');
    }catch(e){
      alert(message);
    }
  }
}

function packetToGrams(size){
  if(size.toLowerCase().includes('kg')) return parseFloat(size) * 1000;
  return parseFloat(size);
}

function downloadCSV(filename, headers, rows){
  const csv = [headers.join(','), ...rows.map(r=>r.map(cell=>{
    const s = String(cell ?? '');
    return s.includes(',') || s.includes('"') ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let toastTimer = null;
function showToast(message, undoFn){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  if(toastTimer) clearTimeout(toastTimer);
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span>${message}</span>${undoFn ? '<button id="toast-undo-btn">UNDO</button>' : ''}`;
  document.body.appendChild(toast);
  if(undoFn){
    toast.querySelector('#toast-undo-btn').onclick = async ()=>{
      await undoFn();
      toast.remove();
      render();
    };
  }
  toastTimer = setTimeout(()=>toast.remove(), 6000);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `samartha-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported || !Array.isArray(imported.students)){ throw new Error('bad format'); }
      data = imported;
      data.expenses = data.expenses || [];
      data.settings = data.settings || { dueDay: 5, darkMode: false, pin: null, lowStock: {} };
      await saveData();
      applyTheme();
      alert('Backup restored successfully.');
      render();
    }catch(err){
      alert('This file could not be read as a valid backup.');
    }
  };
  reader.readAsText(file);
}

function stockFor(productId){
  const producedG = data.production.filter(p=>p.productId===productId).reduce((s,p)=>s+p.qtyKg*1000,0);
  const soldG = data.sweetSales.filter(s=>s.productId===productId).reduce((s,sale)=>s+packetToGrams(sale.packetSize)*sale.qty,0);
  return { producedG, soldG, remainingG: producedG - soldG };
}
function fmtG(g){
  return g>=1000 ? (g/1000).toFixed(g%1000===0?0:2)+'kg' : Math.round(g)+'g';
}

function isOverdueNow(){
  return new Date().getDate() > (data.settings.dueDay || 5);
}

      <div class="stat"><div class="n">${fmtMoney(unpaidTiffinTotal)}</div><div class="l">Unpaid tiffin dues</div></div>

      <div class="stat"><div class="n">${fmtMoney(expensesThisMonth)}</div><div class="l">Expenses this month</div></div>

    </div>

      <h2>Payment status this month</h2>
      <div style="position:relative;height:180px;max-width:260px;margin:0 auto;">
        <canvas id="paymentStatusChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>Revenue trend — last 6 months</h2>

        ${pendingStudents.map(s=>`
          <div class="student-row">

              <div class="student-meta">Mess fee · ${fmtMoney(RATES[s.gender])} · ${monthLabel}</div>

              <button class="ghost dash-pay-mess" data-id="${s.id}">Mark paid</button>
            </div>
          </div>
        `).join('')}

          <div class="student-row">
            <div>
              <div class="student-name">${t.name}</div>
              <div class="student-meta">Tiffin · ${t.count} pkt · ${fmtMoney(t.amount)} · ${new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="ghost dash-remind-tiffin" data-id="${t.id}">Remind</button>

function drawDashboardCharts(pendingCount, paidCount){
  if(typeof Chart === 'undefined') return;

  if(paymentStatusChart) paymentStatusChart.destroy();
  const statusCtx = document.getElementById('paymentStatusChart');
  if(statusCtx){
    paymentStatusChart = new Chart(statusCtx, {
      type: 'doughnut',
      data: {
        labels: ['Paid', 'Pending'],
        datasets: [{
          data: [paidCount, pendingCount],
          backgroundColor: ['#4A7856', '#B24444'],
          borderWidth: 0
        }]
      },
      options: {
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 11 }, color: '#6b5f4d', padding: 12 } }
        },
        cutout: '62%'
      }
    });
  }

  if(revenueTrendChart) revenueTrendChart.destroy();
  const trendCtx = document.getElementById('revenueTrendChart');
  if(trendCtx){
    const months = lastNMonths(6);
    const messData = months.map(m => data.payments.filter(p=>p.month===m.key).reduce((s,p)=>s+p.amount,0));
    const sweetsData = months.map(m => data.sweetSales.filter(s=>s.date.slice(0,7)===m.key).reduce((s,x)=>s+x.amount,0));
    revenueTrendChart = new Chart(trendCtx, {
      type: 'bar',
      data: {
        labels: months.map(m=>m.label),
        datasets: [
          { label: 'Mess', data: messData, backgroundColor: '#7C3131', borderRadius: 4 },
          { label: 'Sweets/Namkeen', data: sweetsData, backgroundColor: '#C98A1A', borderRadius: 4 }
        ]
      },
      options: {
        maintainAspectRatio: false,
        scales: {
          x: { grid: { display: false }, ticks: { color: '#6b5f4d', font: { size: 11 } } },
          y: { ticks: { color: '#6b5f4d', font: { size: 10 } }, grid: { color: '#E5D9C0' } }
        },
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 11 }, color: '#6b5f4d', padding: 12 } }
        }
      }
    });
  }
}

// ---------- ATTENDANCE ----------
function renderAttendance(el){
  if(data.students.length===0){
    el.innerHTML = '<div class="card"><div class="empty">Add students first, then mark their daily attendance here.</div></div>';
    return;
  }
  if(!attSelectedStudent) attSelectedStudent = data.students[0].id;
  const mk = monthKey(attMonth);
  const year = attMonth.getFullYear(), month = attMonth.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstWeekday = new Date(year, month, 1).getDay();
  const studentAtt = (data.attendance[attSelectedStudent] && data.attendance[attSelectedStudent][mk]) || [];
  const presentCount = studentAtt.length;

  el.innerHTML = `
    <div class="card">
      <div class="student-picker">
        ${data.students.map(s=>`<div class="chip ${s.id===attSelectedStudent?'sel':''}" data-id="${s.id}">${s.name}</div>`).join('')}
      </div>
      <div class="month-nav">
        <button id="prev-m">‹</button>
        <div class="m-label">${attMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>
        <button id="next-m">›</button>
      </div>
      <div class="att-grid">
        ${['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:10px;color:var(--ink-soft);font-weight:700;">${d}</div>`).join('')}
        ${Array(firstWeekday).fill(0).map(()=>'<div class="att-day blank"></div>').join('')}
        ${Array(daysInMonth).fill(0).map((_,i)=>{
          const day = i+1;
          const isPresent = studentAtt.includes(day);
          return `<div class="att-day ${isPresent?'present':''}" data-day="${day}">${day}</div>`;
        }).join('')}
      </div>
      <div style="margin-top:12px;font-size:12.5px;color:var(--ink-soft);text-align:center;">
        ${presentCount} day${presentCount===1?'':'s'} marked present this month
      </div>
    </div>
  `;
  el.querySelectorAll('.chip[data-id]').forEach(c=>{
    c.onclick = ()=>{ attSelectedStudent = c.dataset.id; render(); };
  });
  el.querySelector('#prev-m').onclick = ()=>{ attMonth = new Date(year, month-1, 1); render(); };
  el.querySelector('#next-m').onclick = ()=>{ attMonth = new Date(year, month+1, 1); render(); };
  el.querySelectorAll('.att-day[data-day]').forEach(d=>{
    d.onclick = async ()=>{
      const day = parseInt(d.dataset.day);
      if(!data.attendance[attSelectedStudent]) data.attendance[attSelectedStudent] = {};
      if(!data.attendance[attSelectedStudent][mk]) data.attendance[attSelectedStudent][mk] = [];
      const arr = data.attendance[attSelectedStudent][mk];
      const idx = arr.indexOf(day);
      if(idx>-1) arr.splice(idx,1); else arr.push(day);
      await saveData();
      render();
    };
  });
}

    <div class="summary-strip">

                <div class="student-name">${s.name}</div>
                <div class="student-meta">${fmtMoney(rate)}/mo${payment?' · paid '+new Date(payment.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):''}</div>

  el.querySelectorAll('.remind-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const s = data.students.find(x=>x.id===btn.dataset.id);
      const rate = btn.dataset.rate;
      const monthName = attMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
      const message = `Hi ${s.name}, this is a reminder that your mess payment of ${fmtMoney(parseInt(rate))} for ${monthName} is due. Please pay at your earliest convenience. Thank you!`;
      sendReminder(s.name, s.phone, message);
    };
  });
  el.querySelectorAll('.receipt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const s = data.students.find(x=>x.id===btn.dataset.id);
      const payment = paidThisMonth.find(p=>p.studentId===s.id);
      const monthName = attMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
      const message = `Samartha Mess — Payment Receipt\nName: ${s.name}\nMonth: ${monthName}\nAmount: ${fmtMoney(payment.amount)}\nPaid on: ${new Date(payment.date).toLocaleDateString('en-IN')}\nThank you!`;
      sendReminder(s.name, s.phone, message);
    };
  });
  el.querySelector('#export-payments-btn').onclick = ()=>{
    const rows = data.students.map(s=>{
      const payment = paidThisMonth.find(p=>p.studentId===s.id);
      const rate = RATES[s.gender];
      return [s.name, s.gender, rate, payment?'Paid':'Pending', payment?new Date(payment.date).toLocaleDateString('en-IN'):''];
    });
    downloadCSV(`payments-${mk}.csv`, ['Name','Gender','Rate','Status','Paid Date'], rows);
  };
}

// ---------- TIFFIN LOG (irregular friends) ----------
function renderTiffin(el){
  const todayLogs = data.tiffinLog.slice().reverse();
  const totalUnpaid = data.tiffinLog.filter(t=>!t.paid).reduce((s,t)=>s+t.amount,0);
  el.innerHTML = `
    <div class="summary-strip">
      <div class="stat"><div class="n">${fmtMoney(totalUnpaid)}</div><div class="l">Unpaid tiffin dues</div></div>
      <div class="stat"><div class="n">₹${TIFFIN_RATE}</div><div class="l">Rate per tiffin</div></div>
    </div>
    <div class="card">
      <h2>Log a tiffin (irregular / one-off eaters)</h2>
      <div class="row">
        <div><label>Name</label><input id="t-name" placeholder="Who ate"></div>
        <div><label>Tiffins</label><input id="t-count" type="number" min="1" value="1"></div>
      </div>
      <div class="row">
        <div><label>Date</label><input id="t-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <button class="primary" id="add-tiffin-btn">Log entry</button>
    </div>
    <div class="card">
      <h2>Recent entries</h2>
      ${todayLogs.length===0 ? '<div class="empty">No tiffin entries yet.</div>' : todayLogs.map(t=>`
        <div class="tiffin-entry">
          <div>
            <div style="font-weight:600;">${t.name}</div>
            <div style="font-size:11px;color:var(--ink-soft);">${t.count} tiffin${t.count>1?'s':''} · ${new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="amt">${fmtMoney(t.amount)}</span>
            ${t.paid ? '<span class="badge paid">PAID</span>' : `
              <button class="ghost remind-tiffin" data-id="${t.id}">Remind</button>
              <button class="ghost pay-tiffin" data-id="${t.id}">Mark paid</button>
            `}
          </div>
        </div>
      `).join('')}
    </div>
    <button class="ghost" id="export-tiffin-btn" style="width:100%;">Export all entries (CSV)</button>
  `;
  el.querySelector('#add-tiffin-btn').onclick = async ()=>{
    const name = el.querySelector('#t-name').value.trim();
    const count = parseInt(el.querySelector('#t-count').value) || 1;
    const dateVal = el.querySelector('#t-date').value;
    if(!name){ alert('Please enter a name'); return; }
    data.tiffinLog.push({
      id: uid(), name, count, amount: count*TIFFIN_RATE,
      date: dateVal, paid: false
    });
    await saveData();
    render();
  };
  el.querySelectorAll('.pay-tiffin').forEach(btn=>{
    btn.onclick = async ()=>{
      const entry = data.tiffinLog.find(t=>t.id===btn.dataset.id);
      if(entry) entry.paid = true;
      await saveData();
      render();
    };
  });
  el.querySelectorAll('.remind-tiffin').forEach(btn=>{
    btn.onclick = ()=>{
      const entry = data.tiffinLog.find(t=>t.id===btn.dataset.id);
      if(!entry) return;
      const message = `Hi ${entry.name}, just a reminder — you have a pending tiffin payment of ${fmtMoney(entry.amount)} (${entry.count} tiffin${entry.count>1?'s':''} on ${new Date(entry.date).toLocaleDateString('en-IN')}). Please settle when you can. Thanks!`;
      sendReminder(entry.name, null, message);
    };
  });
  el.querySelector('#export-tiffin-btn').onclick = ()=>{
    const rows = data.tiffinLog.map(t=>[t.name, t.count, t.amount, new Date(t.date).toLocaleDateString('en-IN'), t.paid?'Paid':'Pending']);
    downloadCSV(`tiffin-log.csv`, ['Name','Tiffins','Amount','Date','Status'], rows);
  };
}

// ---------- SWEETS & NAMKEEN ----------
function renderSweets(el){
  const mk = monthKey(sweetMonth);
  const salesThisMonth = data.sweetSales.filter(s=>s.date.slice(0,7)===mk);
  const totalRevenue = salesThisMonth.reduce((sum,s)=>sum+s.amount,0);
  const recentSales = data.sweetSales.slice().reverse().slice(0,20);
  const recentProduction = data.production.slice().reverse().slice(0,10);

  el.innerHTML = `
    <div class="summary-strip">
      <div class="stat"><div class="n">${fmtMoney(totalRevenue)}</div><div class="l">Revenue this month</div></div>
      <div class="stat"><div class="n">${salesThisMonth.length}</div><div class="l">Sales logged</div></div>
    </div>
    <div class="card">
      <h2>Stock on hand</h2>
      ${data.products.map(p=>{
        const st = stockFor(p.id);
        const threshold = data.settings.lowStock[p.id] || 500;
        const isLow = st.remainingG <= threshold;
        return `
          <div class="student-row">
            <div>
              <div class="student-name">${p.name}</div>
              <div class="student-meta">Made ${fmtG(st.producedG)} · Sold ${fmtG(st.soldG)}</div>
            </div>
            <span class="badge ${st.remainingG<=0?'due':(isLow?'low':'paid')}">${fmtG(Math.max(st.remainingG,0))} left${isLow&&st.remainingG>0?' · LOW':''}</span>
          </div>
        `;
      }).join('')}
    </div>
    <div class="card">
      <h2>Log production (batch made)</h2>
      <div class="row">
        <div>
          <label>Product</label>
          <select id="pr-product">
            ${data.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
          </select>
        </div>
        <div><label>Quantity made (kg)</label><input id="pr-qty" type="number" min="0.1" step="0.1" value="1"></div>
      </div>
      <div class="row">
        <div><label>Date</label><input id="pr-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <button class="primary" id="add-production-btn">Log batch</button>
      ${recentProduction.length ? `
        <div style="margin-top:10px;">
          ${recentProduction.map(p=>{
            const product = data.products.find(x=>x.id===p.productId);
            return `<div class="tiffin-entry"><div style="font-size:12.5px;">${product?product.name:'Unknown'} · ${p.qtyKg}kg</div><div style="font-size:11px;color:var(--ink-soft);">${new Date(p.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
    <div class="card">
      <h2>Packet prices</h2>
      ${data.products.map(p=>`
        <div style="margin-bottom:10px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${p.name} <span style="font-weight:400;color:var(--ink-soft);font-size:11.5px;">(${p.category})</span></div>
          <div class="row">
            ${p.packets.map((pk,i)=>`
              <div>
                <label>${pk.size}</label>
                <input type="number" min="0" class="packet-price" data-pid="${p.id}" data-idx="${i}" value="${pk.price}">
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
      <button class="ghost" id="save-rates-btn" style="width:100%;">Save prices</button>
    </div>
    <div class="card">
      <h2>Log a sale</h2>
      <div class="row">
        <div style="flex:2;">
          <label>Item</label>
          <select id="sw-item">
            ${data.products.map(p=>`<optgroup label="${p.name}">
              ${p.packets.map((pk,i)=>`<option value="${p.id}::${i}">${pk.size} — ${fmtMoney(pk.price)}</option>`).join('')}
            </optgroup>`).join('')}
          </select>
        </div>
        <div><label>Packets sold</label><input id="sw-qty" type="number" min="1" step="1" value="1"></div>
      </div>
      <div class="row">
        <div><label>Buyer / note (optional)</label><input id="sw-buyer" placeholder="Walk-in, shop name, etc."></div>
        <div><label>Date</label><input id="sw-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <button class="primary" id="add-sale-btn">Log sale</button>
    </div>
    <div class="card">
      <h2>Recent sales</h2>
      ${recentSales.length===0 ? '<div class="empty">No sales logged yet.</div>' : recentSales.map(s=>{
        const product = data.products.find(p=>p.id===s.productId);
        return `
          <div class="tiffin-entry">
            <div>
              <div style="font-weight:600;">${product?product.name:'Unknown'} · ${s.packetSize}</div>
              <div style="font-size:11px;color:var(--ink-soft);">${s.qty} packet${s.qty>1?'s':''}${s.buyer?' · '+s.buyer:''} · ${new Date(s.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
            </div>
            <span class="amt">${fmtMoney(s.amount)}</span>
          </div>
        `;
      }).join('')}
    </div>
    <button class="ghost" id="export-sweets-btn" style="width:100%;">Export all sales (CSV)</button>
  `;

  el.querySelector('#add-production-btn').onclick = async ()=>{
    const productId = el.querySelector('#pr-product').value;
    const qtyKg = parseFloat(el.querySelector('#pr-qty').value) || 0;
    const dateVal = el.querySelector('#pr-date').value;
    if(qtyKg<=0){ alert('Please enter a valid quantity'); return; }
    data.production.push({ id: uid(), productId, qtyKg, date: dateVal });
    await saveData();
    render();
  };

  el.querySelector('#save-rates-btn').onclick = async ()=>{
    el.querySelectorAll('.packet-price').forEach(inp=>{
      const product = data.products.find(p=>p.id===inp.dataset.pid);
      if(product) product.packets[parseInt(inp.dataset.idx)].price = parseFloat(inp.value) || 0;
    });
    await saveData();
    render();
  };

  el.querySelector('#add-sale-btn').onclick = async ()=>{
    const [productId, idx] = el.querySelector('#sw-item').value.split('::');
    const qty = parseInt(el.querySelector('#sw-qty').value) || 0;
    const buyer = el.querySelector('#sw-buyer').value.trim();
    const dateVal = el.querySelector('#sw-date').value;
    const product = data.products.find(p=>p.id===productId);
    const packet = product ? product.packets[parseInt(idx)] : null;
    if(!packet || qty<=0){ alert('Please enter a valid number of packets'); return; }
    data.sweetSales.push({
      id: uid(), productId, packetSize: packet.size, qty,
      amount: Math.round(packet.price * qty),
      buyer, date: dateVal
    });
    await saveData();
    render();
  };

  el.querySelector('#export-sweets-btn').onclick = ()=>{
    const rows = data.sweetSales.map(s=>{
      const product = data.products.find(p=>p.id===s.productId);
      return [product?product.name:'Unknown', s.packetSize, s.qty, s.amount, s.buyer||'', new Date(s.date).toLocaleDateString('en-IN')];
    });
    downloadCSV('sweets-namkeen-sales.csv', ['Product','Packet Size','Packets Sold','Amount','Buyer','Date'], rows);
  };
}

// ---------- EXPENSES ----------
function renderExpenses(el){
  const mk = monthKey(new Date());
  const thisMonth = data.expenses.filter(e=>e.date.slice(0,7)===mk);
  const totalThisMonth = thisMonth.reduce((s,e)=>s+e.amount,0);
  const recent = data.expenses.slice().reverse().slice(0,25);
  const CATEGORIES = ['Ingredients','Gas','Labor','Rent','Packaging','Other'];

  el.innerHTML = `
    <div class="summary-strip">
      <div class="stat"><div class="n">${fmtMoney(totalThisMonth)}</div><div class="l">Expenses this month</div></div>
      <div class="stat"><div class="n">${thisMonth.length}</div><div class="l">Entries logged</div></div>
    </div>
    <div class="card">
      <h2>Log an expense</h2>
      <div class="row">
        <div>
          <label>Category</label>
          <select id="ex-cat">${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
        <div><label>Amount</label><input id="ex-amt" type="number" min="1" placeholder="₹"></div>
      </div>
      <div class="row">
        <div><label>Note (optional)</label><input id="ex-note" placeholder="e.g. vegetables from market"></div>
        <div><label>Date</label><input id="ex-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <button class="primary" id="add-expense-btn">Log expense</button>
    </div>
    <div class="card">
      <h2>Recent expenses</h2>
      ${recent.length===0 ? '<div class="empty">No expenses logged yet.</div>' : recent.map(e=>`
        <div class="tiffin-entry">
          <div>
            <div style="font-weight:600;">${e.category}${e.note?' · '+e.note:''}</div>
            <div style="font-size:11px;color:var(--ink-soft);">${new Date(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="amt">${fmtMoney(e.amount)}</span>
            <button class="del" data-id="${e.id}">Remove</button>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="ghost" id="export-expenses-btn" style="width:100%;">Export all expenses (CSV)</button>
  `;

  el.querySelector('#add-expense-btn').onclick = async ()=>{
    const category = el.querySelector('#ex-cat').value;
    const amount = parseFloat(el.querySelector('#ex-amt').value) || 0;
    const note = el.querySelector('#ex-note').value.trim();
    const dateVal = el.querySelector('#ex-date').value;
    if(amount<=0){ alert('Please enter a valid amount'); return; }
    data.expenses.push({ id: uid(), category, amount, note, date: dateVal });
    await saveData();
    render();
  };
  el.querySelectorAll('.del[data-id]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = data.expenses.findIndex(e=>e.id===btn.dataset.id);
      const removed = data.expenses[idx];
      data.expenses.splice(idx,1);
      await saveData();
      render();
      showToast('Expense removed.', async ()=>{
        data.expenses.splice(idx,0,removed);
        await saveData();
      });
    };
  });
  el.querySelector('#export-expenses-btn').onclick = ()=>{
    const rows = data.expenses.map(e=>[e.category, e.amount, e.note||'', new Date(e.date).toLocaleDateString('en-IN')]);
    downloadCSV('expenses.csv', ['Category','Amount','Note','Date'], rows);
  };
}

// ---------- SETTINGS ----------
function renderSettings(el){
  el.innerHTML = `
    <div class="card">
      <h2>Backup &amp; restore</h2>
      <div class="student-meta" style="margin-bottom:10px;">Save a copy of everything — students, payments, sales, expenses — as a file you can keep safe or move to another device.</div>
      <button class="ghost" id="export-backup-btn" style="width:100%;margin-bottom:8px;">Export full backup (JSON)</button>
      <label>Restore from a backup file</label>
      <input type="file" id="import-backup-input" accept="application/json">
    </div>

    <div class="card">
      <h2>Payment due date</h2>
      <div class="student-meta" style="margin-bottom:10px;">Students unpaid after this day of the month show as overdue on the Dashboard.</div>
      <div class="row">
        <div><label>Due day of month</label><input id="due-day-input" type="number" min="1" max="28" value="${data.settings.dueDay}"></div>
      </div>
      <button class="ghost" id="save-due-day-btn" style="width:100%;">Save</button>
    </div>

    <div class="card">
      <h2>Low-stock alerts</h2>
      <div class="student-meta" style="margin-bottom:10px;">Get a warning on the Dashboard when stock drops below this amount.</div>
      ${data.products.map(p=>`
        <div class="row">
          <div><label>${p.name} (grams)</label><input type="number" min="0" class="low-stock-input" data-id="${p.id}" value="${data.settings.lowStock[p.id]||500}"></div>
        </div>
      `).join('')}
      <button class="ghost" id="save-lowstock-btn" style="width:100%;">Save thresholds</button>
    </div>

    <div class="card">
      <h2>Add a new product</h2>
      <div class="row">
        <div><label>Product name</label><input id="np-name" placeholder="e.g. Motichoor Ladoo"></div>
        <div>
          <label>Category</label>
          <select id="np-category"><option value="Sweet">Sweet</option><option value="Namkeen">Namkeen</option></select>
        </div>
      </div>
      <div class="student-meta" style="margin:6px 0;">Add up to 4 packet sizes with prices (leave blank to skip)</div>
      <div class="row">
        <div><input id="np-size1" placeholder="Size e.g. 250g"></div>
        <div><input id="np-price1" type="number" min="0" placeholder="Price ₹"></div>
      </div>
      <div class="row">
        <div><input id="np-size2" placeholder="Size e.g. 500g"></div>
        <div><input id="np-price2" type="number" min="0" placeholder="Price ₹"></div>
      </div>
      <div class="row">
        <div><input id="np-size3" placeholder="Size e.g. 1kg"></div>
        <div><input id="np-price3" type="number" min="0" placeholder="Price ₹"></div>
      </div>
      <button class="primary" id="add-product-btn">Add product</button>
    </div>

    <div class="card">
      <h2>Appearance</h2>
      <div class="toggle-row">
        <span>Dark mode</span>
        <label class="switch"><input type="checkbox" id="dark-toggle" ${data.settings.darkMode?'checked':''}><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <h2>App lock (PIN)</h2>
      <div class="student-meta" style="margin-bottom:10px;">${data.settings.pin ? 'A PIN is currently set.' : 'No PIN set — anyone opening this file can see your data.'}</div>
      <div class="row">
        <div><label>4-digit PIN</label><input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="primary" id="set-pin-btn" style="flex:1;">${data.settings.pin?'Change PIN':'Set PIN'}</button>
        ${data.settings.pin ? '<button class="ghost" id="remove-pin-btn" style="flex:1;">Remove PIN</button>' : ''}
      </div>
    </div>
  `;

  el.querySelector('#export-backup-btn').onclick = exportBackup;
  el.querySelector('#import-backup-input').onchange = (e)=>{
    if(e.target.files[0]) importBackup(e.target.files[0]);
  };
  el.querySelector('#save-due-day-btn').onclick = async ()=>{
    data.settings.dueDay = parseInt(el.querySelector('#due-day-input').value) || 5;
    await saveData();
    showToast('Due date saved.');
  };
  el.querySelector('#save-lowstock-btn').onclick = async ()=>{
    el.querySelectorAll('.low-stock-input').forEach(inp=>{
      data.settings.lowStock[inp.dataset.id] = parseFloat(inp.value) || 0;
    });
    await saveData();
    showToast('Low-stock thresholds saved.');
  };
  el.querySelector('#add-product-btn').onclick = async ()=>{
    const name = el.querySelector('#np-name').value.trim();
    const category = el.querySelector('#np-category').value;
    if(!name){ alert('Please enter a product name'); return; }
    const packets = [];
    for(let i=1;i<=3;i++){
      const size = el.querySelector('#np-size'+i).value.trim();
      const price = parseFloat(el.querySelector('#np-price'+i).value);
      if(size && price>0) packets.push({size, price});
    }
    if(packets.length===0){ alert('Please add at least one packet size and price'); return; }
    data.products.push({ id: uid(), name, category, packets });
    await saveData();
    render();
    showToast(name + ' added to your product list.');
  };
  el.querySelector('#dark-toggle').onchange = async (e)=>{
    data.settings.darkMode = e.target.checked;
    applyTheme();
    await saveData();
  };
  el.querySelector('#set-pin-btn').onclick = async ()=>{
    const val = el.querySelector('#pin-input').value;
    if(!/^\d{4}$/.test(val)){ alert('PIN must be exactly 4 digits'); return; }
    data.settings.pin = val;
    await saveData();
    showToast('PIN saved. It will be asked next time you open this app.');
    el.querySelector('#pin-input').value = '';
  };
  const removeBtn = el.querySelector('#remove-pin-btn');
  if(removeBtn){
    removeBtn.onclick = async ()=>{
      if(!confirm('Remove the PIN lock?')) return;
      data.settings.pin = null;
      await saveData();
      render();
    };
  }
}

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW registration failed', e));
  });
}
</script>
